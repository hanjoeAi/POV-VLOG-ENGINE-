<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POV Vlog Generator v5 FIX</title>

<style>
body {background:#020617; color:white; font-family:Arial; padding:20px;}
input, select, textarea, button {
  width:100%; margin:8px 0; padding:10px; border-radius:8px; border:none;
}
button {background:orange; font-weight:bold;}
textarea {height:150px;}
</style>
</head>

<body>

<h2>🔥 POV Vlog Generator (FIX)</h2>

<select id="mode">
<option value="time">Time Travel</option>
<option value="daily">Daily</option>
</select>

<input id="keyword" placeholder="alien di hutan">
<input id="location" placeholder="lokasi">

<select id="lang">
<option value="id">Indonesia</option>
<option value="en">English</option>
</select>

<input id="scenes" type="number" value="4">

<button onclick="generate()">GENERATE</button>

<h3>Video</h3>
<textarea id="video"></textarea>

<h3>Image</h3>
<textarea id="image"></textarea>

<h3>Script</h3>
<textarea id="script"></textarea>

<h3>Hashtag</h3>
<textarea id="tag"></textarea>

<script>
function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function dialog(i, lang){
  const id = [
    "ini gak normal...",
    "gue denger sesuatu...",
    "apa itu barusan?!",
    "ini makin parah...",
    "gue harus pergi sekarang!"
  ];
  const en = [
    "this is not normal...",
    "i hear something...",
    "what was that?!",
    "this is getting worse...",
    "i need to leave now!"
  ];
  return lang === "id" ? id[i%5] : en[i%5];
}

function generate(){
  try{
    let keyword = document.getElementById("keyword").value || "kejadian aneh";
    let location = document.getElementById("location").value || "tempat misterius";
    let lang = document.getElementById("lang").value;
    let scenes = parseInt(document.getElementById("scenes").value) || 4;

    let video = "";
    let script = "";
    let image = "";
    let hashtag = "";

    // VIDEO PROMPT
    video += "[REFERENCE_IMAGE: uploaded]\n";
    video += "POV handheld selfie vlog, ultra realistic, raw footage\n\n";

    for(let i=1;i<=scenes;i++){
      video += "SCENE " + i + ": ";

      if(i==1){
        video += "normal vlog di " + location + ", suasana tenang";
      }
      else if(i==2){
        video += "kejadian aneh mulai muncul: " + keyword;
      }
      else if(i==scenes){
        video += "chaos, panik, " + rand(["kamera jatuh","blackout","lari ketakutan"]);
      }
      else{
        video += "ketegangan meningkat, situasi tidak normal";
      }

      let d = dialog(i, lang);

      video += "\n- camera: handheld shake, realistic movement";
      video += "\n- audio: ambience + nafas berat";
      video += "\n- dialog: " + d + "\n\n";

      script += d + " ";
    }

    // THUMBNAIL
    image = "POV selfie, ekspresi kaget, " + keyword + ", cinematic lighting, ultra realistic";

    // HASHTAG
    hashtag = "#povvlog #aivideo #viral #" + keyword.replace(/ /g,"");

    // OUTPUT
    document.getElementById("video").value = video;
    document.getElementById("image").value = image;
    document.getElementById("script").value = script;
    document.getElementById("tag").value = hashtag;

  }catch(e){
    alert("ERROR: " + e.message);
  }
}
</script>

</body>
</html>
