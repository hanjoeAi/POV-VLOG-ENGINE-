<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POV Vlog Generator v5 FINAL</title>

<style>
body {background:#020617; color:white; font-family:Arial; padding:20px;}
input, select, textarea, button {
  width:100%; margin:8px 0; padding:10px; border-radius:8px; border:none;
}
button {background:orange; font-weight:bold;}
textarea {height:160px;}
  pre {
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  overflow:auto;
  margin-bottom:12px;
  }
</style>
</head>

<body>

<h2>🔥 POV Vlog Generator FINAL</h2>

<label>Upload Image Reference</label>
<input type="file" id="imgRef" accept="image/*">

<select id="mode">
<option value="time">Time Travel</option>
<option value="daily">Daily</option>
</select>

<input id="keyword" placeholder="alien di hutan">
<input id="location" placeholder="lokasi">

<select id="lang">
<option value="id">Indonesia</option>
<option value="en">English</option>
</select>

<input id="scenes" type="number" value="4">

<button onclick="generate()">GENERATE</button>

<script>
function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function generate(){
  try{

    let keyword = document.getElementById("keyword").value || "kejadian aneh";
    let location = document.getElementById("location").value || "tempat misterius";
    let lang = document.getElementById("lang").value;
    let scenes = parseInt(document.getElementById("scenes").value) || 4;

    let imgEl = document.getElementById("imgRef");
    let refText = imgEl && imgEl.files.length > 0 
      ? "same person as reference image, consistent face, no variation"
      : "generic person";

    let imageHTML = "";
    let videoHTML = "";

    for(let i=1;i<=scenes;i++){

      // ===== IMAGE PROMPT (CINEMATIC STRUCTURE) =====
      let imgPrompt = `
POV selfie vlog shot, ${refText}
location: ${location}
scenario: ${keyword}
scene progression: ${
        i==1 ? "normal situation, calm environment" :
        i==2 ? "strange anomaly begins to appear" :
        i==scenes ? "chaos, fear, panic, dramatic climax" :
        "tension rising, something feels wrong"
      }

character:
- expression: ${
        i==1 ? "neutral, relaxed" :
        i==2 ? "confused, slightly worried" :
        i==scenes ? "terrified, shocked" :
        "anxious, alert"
      }
- camera: handheld selfie, slight shake
- angle: eye level, close-up face

lighting:
- realistic natural light
- cinematic contrast
- dynamic shadows

style:
- ultra realistic
- documentary vlog
- raw footage
`;

      imageHTML += `<pre><code>${imgPrompt}</code></pre>`;

      // ===== VIDEO PROMPT =====
      let videoPrompt = `
POV vlog video, handheld camera
based on image scene ${i}

action:
${
  i==1 ? "walking casually, talking to camera" :
  i==2 ? "noticing something strange, reacting slowly" :
  i==scenes ? "running, panic, chaotic movement" :
  "looking around, nervous movement"
}

camera:
- handheld shake
- natural movement
- imperfect framing

audio:
- ambient sound
- breathing
- environmental noise

dialog (${lang}):
${
  lang=="id"
  ? ["ini gak normal","gue denger sesuatu","apa itu?!","ini makin parah","gue cabut!"][i%5]
  : ["this is not normal","i hear something","what was that","this is getting worse","im leaving"][i%5]
}
`;

      videoHTML += `<pre><code>${videoPrompt}</code></pre>`;
    }

    let thumbnail = `POV selfie, shocked expression, ${keyword}, cinematic lighting, ultra realistic`;
    let hashtag = `#povvlog #aivideo #cinematic #viral #fyp #${keyword.replace(/ /g,"")}`;

    document.getElementById("image").innerHTML = imageHTML;
    document.getElementById("video").innerHTML = videoHTML;
    document.getElementById("thumbnail").textContent = thumbnail;
    document.getElementById("tag").textContent = hashtag;

  }catch(e){
    alert("ERROR: " + e.message);
  }
}
</script>

</body>
</html>
