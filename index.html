<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POV Vlog Generator v5 FINAL</title>

<style>
body {background:#020617; color:white; font-family:Arial; padding:20px;}
input, select, textarea, button {
  width:100%; margin:8px 0; padding:10px; border-radius:8px; border:none;
}
button {background:orange; font-weight:bold;}
textarea {height:160px;}
</style>
</head>

<body>

<h2>🔥 POV Vlog Generator FINAL</h2>

<label>Upload Image Reference</label>
<input type="file" id="imgRef" accept="image/*">

<select id="mode">
<option value="time">Time Travel</option>
<option value="daily">Daily</option>
</select>

<input id="keyword" placeholder="alien di hutan">
<input id="location" placeholder="lokasi">

<select id="lang">
<option value="id">Indonesia</option>
<option value="en">English</option>
</select>

<input id="scenes" type="number" value="4">

<button onclick="generate()">GENERATE</button>

<h3>🎬 IMAGE PROMPT (per scene)</h3>
<textarea id="image"></textarea>

<h3>🎥 VIDEO PROMPT (per scene)</h3>
<textarea id="video"></textarea>

<h3>🖼️ THUMBNAIL</h3>
<textarea id="thumbnail"></textarea>

<h3>🔥 HASHTAG</h3>
<textarea id="tag"></textarea>

<script>
function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function dialog(i, lang){
  const id = ["ini gak normal","gue denger sesuatu","apa itu?!","ini makin parah","gue cabut!"];
  const en = ["not normal","i hear something","what was that","getting worse","im leaving"];
  return lang === "id" ? id[i%5] : en[i%5];
}

function generate(){
  try{

    // INPUT
    let keyword = document.getElementById("keyword").value || "kejadian aneh";
    let location = document.getElementById("location").value || "tempat misterius";
    let lang = document.getElementById("lang").value;
    let scenes = parseInt(document.getElementById("scenes").value) || 4;

    // 🔥 IMAGE REFERENCE FIX (ANTI ERROR TOTAL)
    let refText = "[NO REFERENCE IMAGE]";
    let imgEl = document.getElementById("imgRef");

    if(imgEl && imgEl.files && imgEl.files.length > 0){
      refText = "[REFERENCE_IMAGE: uploaded]";
    }

    let imgPrompt = "";
    let videoPrompt = "";

    // ===== IMAGE PROMPT =====
    for(let i=1;i<=scenes;i++){

      imgPrompt += "=== IMAGE SCENE " + i + " ===\n";

      if(i==1){
        imgPrompt += refText + "\nPOV selfie di " + location + ", suasana normal, natural lighting, ultra realistic\n\n";
      }
      else if(i==2){
        imgPrompt += refText + "\nkejadian aneh mulai muncul: " + keyword + ", ekspresi bingung\n\n";
      }
      else if(i==scenes){
        imgPrompt += refText + "\nchaos, panik, ekspresi takut, dramatic lighting\n\n";
      }
      else{
        imgPrompt += refText + "\nketegangan meningkat, situasi tidak normal\n\n";
      }
    }

    // ===== VIDEO PROMPT =====
    for(let i=1;i<=scenes;i++){

      videoPrompt += "=== VIDEO SCENE " + i + " ===\n";

      if(i==1){
        videoPrompt += "POV vlog normal di " + location + "\n";
      }
      else if(i==2){
        videoPrompt += "kejadian mulai: " + keyword + "\n";
      }
      else if(i==scenes){
        videoPrompt += "chaos + " + rand(["blackout","kamera jatuh","lari panik"]) + "\n";
      }
      else{
        videoPrompt += "ketegangan meningkat\n";
      }

      videoPrompt += "camera: handheld shake\n";
      videoPrompt += "audio: ambience + nafas\n";
      videoPrompt += "dialog: " + dialog(i, lang) + "\n\n";
    }

    // THUMBNAIL
    let thumbnail = "POV selfie, ekspresi kaget, " + keyword + ", cinematic lighting, ultra realistic";

    // HASHTAG
    let hashtag = "#povvlog #aivideo #viral #" + keyword.replace(/ /g,"");

    // OUTPUT
    document.getElementById("image").value = imgPrompt;
    document.getElementById("video").value = videoPrompt;
    document.getElementById("thumbnail").value = thumbnail;
    document.getElementById("tag").value = hashtag;

  }catch(e){
    alert("ERROR: " + e.message);
  }
}
</script>

</body>
</html>
