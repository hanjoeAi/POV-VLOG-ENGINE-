<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POV Vlog Generator v5 FINAL</title>

<style>
body {background:#020617; color:white; font-family:Arial; padding:20px;}
input, select, textarea, button {
  width:100%; margin:8px 0; padding:10px; border-radius:8px; border:none;
}
button {background:orange; font-weight:bold;}
textarea {height:160px;}
  pre {
  background:#0f172a;
  padding:12px;
  border-radius:10px;
  overflow:auto;
  margin-bottom:12px;
  }
  .block {
  position: relative;
  margin-bottom: 14px;
}

.copyBtn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: #22c55e;
  color: #000;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}

.copyBtn:hover {
  background: #16a34a;
}
  .block code {
  white-space: pre-wrap;
  }
</style>
</head>

<body>

<h2>🔥 POV Vlog Generator FINAL</h2>

<label>Upload Image Reference</label>
<input type="file" id="imgRef" accept="image/*">

<select id="mode">
<option value="time">Time Travel</option>
<option value="daily">Daily</option>
</select>

<input id="keyword" placeholder="alien di hutan">
<input id="location" placeholder="lokasi">

<select id="lang">
<option value="id">Indonesia</option>
<option value="en">English</option>
</select>

<input id="scenes" type="number" value="4">

<button onclick="generate()">GENERATE</button>

<h3>🎬 IMAGE PROMPT</h3>
<div id="image"></div>

<h3>🎥 VIDEO PROMPT</h3>
<div id="video"></div>

<h3>🖼️ THUMBNAIL</h3>
<pre><code id="thumbnail"></code></pre>

<h3>🔥 HASHTAG</h3>
<pre><code id="tag"></code></pre>

<script>
function rand(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

// MICRO EXPRESSION
function expression(i, last){
  if(i==1) return "relaxed, natural face, steady breathing";
  if(i==2) return "slight confusion, eyebrows tense, subtle eye movement";
  if(i==last) return "extreme fear, eyes wide, heavy breathing, panic";
  return "anxious, scanning surroundings, nervous micro-movements";
}

// CAMERA PATH
function cameraPath(i, last){
  if(i==1) return "stable handheld, slight natural sway";
  if(i==2) return "slow push-in toward face";
  if(i==last) return rand([
    "violent shaky run camera",
    "sudden drop to ground",
    "rapid chaotic movement",
    "whip pan + motion blur"
  ]);
  return rand([
    "slow tracking forward",
    "subtle orbit movement",
    "nervous handheld shake",
    "quick pan left-right"
  ]);
}

// LIGHTING
function lighting(i, last){
  if(i==1) return "natural daylight, soft shadows";
  if(i==2) return "slightly dim, contrast increasing";
  if(i==last) return "dark, high contrast, horror tone";
  return "uneven lighting, shifting shadows";
}

// SOUND DESIGN
function sound(i, last){
  if(i==1) return "natural ambience, wind, distant environment";
  if(i==2) return "ambience + subtle strange noise";
  if(i==last) return rand([
    "loud chaos, breathing, scream, distortion",
    "sudden silence then impact sound",
    "glitch audio, frequency distortion"
  ]);
  return rand([
    "footsteps + ambient wind",
    "distant echo + rustling leaves",
    "low frequency hum"
  ]);
}

// DIALOG
function dialog(i, lang, keyword){

  if(!keyword) keyword = "";

  let type = detectType(keyword);
  const dialogs = {

    alien: {
      id: [
        ["ini tempat biasa aja...", "kayaknya aman..."],
        ["eh... itu cahaya apa?", "kayak ada sesuatu di langit..."],
        ["itu UFO?!", "itu bukan pesawat..."],
        ["mereka ngelihat gue...", "itu makin dekat..."],
        ["GUE CABUT!", "lari sekarang!"]
      ],
      en: [
        ["this looks normal...", "seems safe..."],
        ["what is that light?", "something in the sky..."],
        ["is that a UFO?!", "that’s not a plane..."],
        ["they’re watching me...", "it’s getting closer..."],
        ["I'M OUT!", "run now!"]
      ]
    },

    horror: {
      id: [
        ["sepi banget disini...", "sunyi aneh..."],
        ["eh... ada suara...", "kayak ada yang gerak..."],
        ["itu sosok apa?!", "itu siapa?!"],
        ["dia ngikutin gue...", "itu makin dekat..."],
        ["GUE LARI!", "gue gak kuat!"]
      ],
      en: [
        ["it’s too quiet...", "this place feels wrong..."],
        ["i hear something...", "something moved..."],
        ["what is that figure?!", "who is that?!"],
        ["it’s following me...", "it’s getting closer..."],
        ["RUN!", "i can’t stay here!"]
      ]
    },

    mystery: {
      id: [
        ["kayaknya biasa aja...", "nothing weird..."],
        ["eh tunggu...", "ada yang aneh..."],
        ["itu apa barusan?!", "gue liat sesuatu..."],
        ["ini gak masuk akal...", "ini makin aneh..."],
        ["gue cabut sekarang!", "ini bahaya!"]
      ],
      en: [
        ["seems normal...", "nothing strange..."],
        ["wait...", "something is off..."],
        ["what was that?!", "i saw something..."],
        ["this makes no sense...", "this is getting weird..."],
        ["im leaving now!", "this is dangerous!"]
      ]
    }

  };

  let pool = dialogs[type][lang];
  return rand(pool[i % pool.length]);
  }

function detectType(keyword){

  if(!keyword) keyword = "";

  keyword = keyword.toLowerCase();

  if(keyword.includes("alien") || keyword.includes("ufo"))
    return "alien";

  if(keyword.includes("hantu") || keyword.includes("setan") || keyword.includes("pocong"))
    return "horror";

  if(keyword.includes("malaikat"))
    return "angel";

  if(keyword.includes("monster"))
    return "creature";

  return "mystery";
     }

// ENDING VARIATION
function ending(){
  return rand([
    "suddenly disappears from frame",
    "unknown creature appears behind",
    "reality glitch distortion",
    "camera falls and cuts to black"
  ]);
}

function generate(){

  try{
    let mode = document.getElementById("mode").value;

    let keyword = document.getElementById("keyword").value || "kejadian aneh";
    let location = document.getElementById("location").value || "tempat misterius";
    let lang = document.getElementById("lang").value;
    let scenes = parseInt(document.getElementById("scenes").value) || 4;

    let imgEl = document.getElementById("imgRef");
    let refText = (imgEl && imgEl.files.length > 0)
      ? "same person as reference image, identical face, ultra consistency"
      : "generic person";

    let imageHTML = "";
    let videoHTML = "";

    for(let i=1;i<=scenes;i++){

      let imgPrompt = "";

if(mode === "daily"){

  // ===== DAILY VLOG LOGIC =====
  imgPrompt = `
POV selfie vlog, ${refText}

scene ${i} / ${scenes}

location:
${location}

${
  i==1
  ? "situation: normal daily activity, nothing unusual"
  : i==2
  ? "situation: first anomaly appears: " + keyword
  : i==scenes
  ? "situation: chaos, panic, intense moment"
  : "situation: tension rising, something feels off"
}

composition:
- shot: ${rand(["close-up","medium shot","wide shot"])}
- camera path: ${cameraPath(i, scenes)}
- angle: eye level

character micro-expression:
${expression(i, scenes)}

lighting:
${lighting(i, scenes)}

style:
ultra realistic, raw vlog footage
`;

} else {

  // ===== TIME TRAVEL VLOG (TETAP FULL EVENT) =====
  imgPrompt = `
POV selfie vlog, ${refText}

scene ${i} / ${scenes}

time period / event:
${keyword}

location:
${location}

composition:
- shot: ${rand(["close-up","medium shot","wide shot"])}
- camera path: ${cameraPath(i, scenes)}
- angle: eye level

character micro-expression:
${expression(i, scenes)}

lighting:
${lighting(i, scenes)}

details:
- historical accuracy
- environmental storytelling
- immersive background

style:
ultra realistic, cinematic historical vlog
`;
}

      imageHTML += `
<div class="block">
<button class="copyBtn" onclick="copyText(this)">Copy</button>
<pre><code>${imgPrompt}</code></pre>
</div>`;

      let videoPrompt = `
POV vlog cinematic video (scene ${i})

action:
${
i==1 ? "casual talking to camera" :
i==2 ? "noticing anomaly, slowing movement" :
i==scenes ? ending() :
"nervous scanning environment"
}

camera:
${cameraPath(i, scenes)}

audio:
${sound(i, scenes)}

dialog (${lang}):
${dialog(i, lang)}

extra:
- imperfect framing
- natural motion blur
- handheld realism
`;

      videoHTML += `
<div class="block">
<button class="copyBtn" onclick="copyText(this)">Copy</button>
<pre><code>${videoPrompt}</code></pre>
</div>`;
    }

    let thumbnail = `POV selfie, extreme shock face, ${keyword}, dramatic lighting, ultra realistic, viral thumbnail`;
    let hashtag = `#povvlog #cinematic #aivideo #viral #fyp #story #${keyword.replace(/ /g,"")}`;

    document.getElementById("image").innerHTML = imageHTML;
    document.getElementById("video").innerHTML = videoHTML;
    document.getElementById("thumbnail").textContent = thumbnail;
    document.getElementById("tag").textContent = hashtag;

  }catch(e){
    alert("ERROR: " + e.message);
  }
}

// COPY
function copyText(btn){
  let text = btn.parentElement.innerText.replace("Copy","");
  navigator.clipboard.writeText(text);
  alert("Copied!");
}
    </script>

</body>
</html>
