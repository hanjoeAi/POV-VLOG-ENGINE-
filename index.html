<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic POV Vlog Generator v5 - Full Content Engine</title>
  <style>
    body {font-family: Arial, sans-serif; background:#020617; color:#fff; padding:20px;}
    h1 {text-align:center;}
    .container {max-width:1100px; margin:auto;}
    input, select, textarea, button {
      width:100%; padding:10px; margin:8px 0; border-radius:10px; border:none;
    }
    button {background:#f59e0b; color:#000; font-weight:bold; cursor:pointer;}
    button:hover {background:#d97706;}
    textarea {height:260px;}
    .output {background:#020617; padding:15px; border-radius:12px; border:1px solid #1e293b; margin-top:15px;}
    img {max-width:150px; margin-top:10px; border-radius:10px;}
  </style>
</head>
<body><div class="container">
  <h1>🔥 Cinematic POV Vlog Generator v5</h1><label>Mode</label> <select id="mode"> <option value="time">Time Travel Vlog</option> <option value="daily">Daily Vlog</option> </select>

<label>Upload Image Reference</label> <input type="file" id="imageFile" accept="image/*"> <img id="preview" style="display:none;" />

<label>Keyword / Era</label> <input type="text" id="keyword" placeholder="alien di hutan / ancient rome">

<label>Lokasi</label> <input type="text" id="location" placeholder="hutan, kota, gurun...">

<label>Mood</label> <select id="mood"> <option value="horror">Horror</option> <option value="tense">Tense</option> <option value="epic">Epic</option> <option value="chaotic">Chaotic</option> </select>

<label>Bahasa Dialog</label> <select id="lang"> <option value="id">Bahasa Indonesia</option> <option value="en">English</option> </select>

<label>Jumlah Scene</label> <input type="number" id="scenes" value="4" min="3" max="6">

<button type="button" onclick="generateAll()">🚀 Generate Full Content</button>

  <div class="output">
    <h3>🎬 Video Prompt</h3>
    <textarea id="videoOutput"></textarea><h3>🖼️ Thumbnail Prompt</h3>
<textarea id="imageOutput"></textarea>

<h3>🎙️ Script Narasi</h3>
<textarea id="scriptOutput"></textarea>

<h3>🔥 Hashtag</h3>
<textarea id="hashtagOutput"></textarea>

<button onclick="copyAll()">📋 Copy All</button>

  </div>
</div><script>
// SIMPLIFIED & ROBUST VERSION (NO DOM READY DEPENDENCY)

function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function generateDialog(i, lang){
  const id = [
    "guys ini gak normal...",
    "serius gue denger sesuatu",
    "apa itu barusan?!",
    "ini makin gak masuk akal...",
    "gue harus cabut sekarang!"
  ];
  const en = [
    "guys this is not normal...",
    "I hear something...",
    "what was that?!",
    "this is getting worse...",
    "I need to leave now!"
  ];
  return lang==='id'? id[i%id.length]:en[i%en.length];
}

function generateAll(){
  try {
    const mode = document.getElementById('mode').value;
    const keyword = document.getElementById('keyword').value || "unknown event";
    const location = document.getElementById('location').value || "unknown place";
    const mood = document.getElementById('mood').value;
    const scenes = parseInt(document.getElementById('scenes').value) || 4;
    const lang = document.getElementById('lang').value;

    let video="", image="", script="", hashtag="";

    video += `[REFERENCE_IMAGE: uploaded]
POV vlog, same identity, ultra realistic, mood: ${mood}

`;

    for(let i=1;i<=scenes;i++){
      video += `SCENE ${i}: `;
      if(i===1) video += `normal vlog in ${location}`;
      else if(i===2) video += `strange event begins: ${keyword}`;
      else if(i===scenes) video += `chaos + panic + ${rand(["blackout","camera drop","glitch","run away"])}`;
      else video += `tension increases`;

      video += ` | dialog: "${generateDialog(i,lang)}"
`;
    }

    image = `POV selfie thumbnail, shocked expression, ${keyword}, cinematic lighting, ultra realistic, same face as reference`;

    for(let i=1;i<=scenes;i++){
      script += generateDialog(i,lang) + " ";
    }

    hashtag = `#aivideo #povvlog #viral #cinematic #fyp #storytelling #${keyword.replace(/ /g,'')}`;

    document.getElementById('videoOutput').value = video;
    document.getElementById('imageOutput').value = image;
    document.getElementById('scriptOutput').value = script;
    document.getElementById('hashtagOutput').value = hashtag;

  } catch (err) {
    alert("ERROR: " + err.message);
  }
}

function copyAll(){
  const all = document.getElementById('videoOutput').value + "

" +
              document.getElementById('imageOutput').value + "

" +
              document.getElementById('scriptOutput').value + "

" +
              document.getElementById('hashtagOutput').value;

  navigator.clipboard.writeText(all);
  alert('Copied All!');
}
</script></body>
</html>
